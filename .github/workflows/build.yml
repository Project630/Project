name: SonarQube Analysis

on:

  push:

    branches:

      - flutterflow

  workflow_dispatch:

jobs:

  sonarqube:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code

        uses: actions/checkout@v4

        with:

          fetch-depth: 0

      - name: Setup Flutter

        uses: subosito/flutter-action@v2

        with:

          channel: stable

      - name: Install Dependencies

        run: flutter pub get

      - name: SonarQube Scan

        uses: SonarSource/sonarqube-scan-action@v6

        env:

          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
